name: GD AI Editor - Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build bundled .geode
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install -e .
          python -m pip install "pyinstaller>=6,<7" tbb

      - name: Build standalone audio backend
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name gd-ai-backend --collect-all librosa --collect-all soundfile --collect-all numba --collect-all llvmlite --distpath backend-dist --workpath backend-build --specpath backend-build backend_entry.py
          Copy-Item "backend-dist\gd-ai-backend.exe" "geode\resources\gd-ai-backend.exe" -Force
          Get-Item "geode\resources\gd-ai-backend.exe" | Format-List FullName,Length

      - name: Smoke-test standalone backend
        shell: pwsh
        run: |
          @'
          import math
          import struct
          import wave

          sr = 22050
          duration = 8.0
          bpm = 120.0
          samples = [0.0] * int(sr * duration)

          for beat in [0.5 + i * (60.0 / bpm) for i in range(14)]:
              start = int(beat * sr)
              for n in range(int(0.02 * sr)):
                  i = start + n
                  if i >= len(samples):
                      break
                  samples[i] += 0.75 * math.sin(2.0 * math.pi * 1600.0 * n / sr) * (1.0 - n / (0.02 * sr))

          with wave.open("backend-build/smoke.wav", "wb") as f:
              f.setnchannels(1)
              f.setsampwidth(2)
              f.setframerate(sr)
              pcm = b"".join(struct.pack("<h", max(-32768, min(32767, int(s * 32767)))) for s in samples)
              f.writeframes(pcm)
          '@ | python -

          & "backend-dist\gd-ai-backend.exe" audio analyze "backend-build\smoke.wav" --out "backend-build\smoke.json" --summary
          if ($LASTEXITCODE -ne 0) {
              throw "Standalone backend smoke test failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path "backend-build\smoke.json")) {
              throw "Standalone backend did not create smoke.json"
          }
          Get-Content "backend-build\smoke.json" -TotalCount 20

      - name: Build Geode mod
        id: geode-build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: geode
          sdk: given
          target: Win64
          build-config: Release

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: gd-ai-editor-windows
          path: ${{ steps.geode-build.outputs.build-output }}
          if-no-files-found: error
