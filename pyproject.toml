[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gd-ai-editor"
version = "0.1.0"
description = "Music-aware Geometry Dash gameplay research and generation tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.10.2,<0.12",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "soundfile>=0.12.1,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
gd-ai = "gd_ai_editor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
